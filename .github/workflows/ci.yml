name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - run: dotnet pack --configuration Release --no-build --output artifacts/packages

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: 7
